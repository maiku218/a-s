<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PharmaCon</title>
    <style>
        :root {
            --accent: #f97316;
            --success: #22c55e;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --radius: 8px;
            --radius-lg: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 420px; }
        .page-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-label { font-size: 14px; font-weight: 600; }
        .form-input { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: white; }
        .btn:hover { background: #ea580c; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <a href="{{ url_for('cashier_dashboard') }}" class="back-link">← Back to Dashboard</a>
        <h1 class="page-title">Change Password</h1>
        <p class="page-subtitle">Enter your current password and a new password to update your account.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="old_password" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-input" required>
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              Swal.fire({
                icon: '{{ "success" if category == "success" else "error" }}',
                 title: {{ message | tojson }},
                showConfirmButton: false,
                timer: 2500
              });
            });
          </script>
        {% endfor %}
      {% endif %}
    {% endwith %}

</body>
</html>
