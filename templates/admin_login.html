<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PharmaCon</title>
    <style>
        :root {
            --accent: #10b981;
            --accent-dark: #059669;
            --accent-light: #d1fae5;
            --success: #10b981;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-secondary: #4b5563;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .brand-login {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text);
        }
        .brand-login span { color: var(--accent); }
        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
            text-align: center;
        }
        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: var(--surface);
            color: var(--text);
            transition: all 0.15s;
            margin-bottom: 16px;
        }
        .login-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }
        .login-btn:hover { background: var(--accent-dark); }
        .login-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .login-link:hover { color: var(--accent-dark); text-decoration: underline; }
        .alert-error {
            background: var(--danger-soft);
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-success {
            background: var(--accent-light);
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .link-row { display: flex; justify-content: space-between; margin-top: 20px; }
        *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="brand-login">A'S PHARMAHEALTH & <span>CONVENIENCE</span></div>
        <div class="login-title">Admin Login</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="username" class="login-input" placeholder="Admin Username" required>
            <input type="password" name="password" class="login-input" placeholder="Password" required>
            <button type="submit" class="login-btn">Enter Dashboard</button>
        </form>
        <div class="link-row">
            <a href="{{ url_for('cashier_login') }}" class="login-link">Login as Cashier</a>
            <a href="{{ url_for('change_admin_password') }}" class="login-link">Forgot Password?</a>
        </div>
    </div>
</div>

</body>
</html>
