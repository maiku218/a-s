{% extends 'admin_dashboard.html' %}
{% block page_title %}Edit Product{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="page-header">
        <a href="{{ url_for('all_products') }}" class="back-link">← Back to Inventory</a>
        <h1 class="page-title">Edit Product</h1>
        <p class="page-subtitle">Update product details</p>
    </div>

    {% if product %}
    <form action="{{ url_for('edit_product', id=product[0]) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="id" value="{{ product[0] }}">

        <div class="form-group">
            <label class="form-label">Barcode</label>
            <input type="text" name="barcode" value="{{ product[2] }}" required autofocus class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">Product Name</label>
            <input type="text" name="product_name" value="{{ product[1] }}" required autocomplete="off" class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" required class="form-input">
                <option value="" disabled>Select Type</option>
                <option value="Medical" {% if product[6] == 'Medical' %}selected{% endif %}>Medical (Branded/Generic)</option>
                <option value="Non-Medical" {% if product[6] == 'Non-Medical' %}selected{% endif %}>Non-Medical (Supplies/Hygiene)</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label class="form-label">Price (₱)</label>
                <input type="number" step="0.01" name="price" value="{{ product[4] }}" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Stock</label>
                <div style="display:flex;gap:8px;align-items:stretch;">
                    <input type="text" value="{{ product[5] }} units" readonly disabled class="form-input" style="flex:1;background: var(--bg-alt); color: var(--text-secondary);">
                    <a href="{{ url_for('stock_in') }}" class="btn btn-primary">Stock In</a>
                </div>
            </div>
        </div>

        <div class="form-group" id="expiryGroup">
            <label class="form-label">Expiration Date</label>
            <input type="date" name="expiration_date" value="{{ product[7] or '' }}" class="form-input"
                   style="{% if not product[7] %}display:none;{% endif %}">
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer;">
                <input type="checkbox" id="noExpirationCheckbox" {% if not product[7] %}checked{% endif %}>
                No expiration date
            </label>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border);">
            <a href="{{ url_for('all_products') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
    {% else %}
    <div style="text-align: center; padding: 48px;">
        <p style="color: var(--danger); font-size: 16px; margin-bottom: 8px;">Product not found.</p>
        <a href="{{ url_for('all_products') }}" class="back-link">← Back to Inventory</a>
    </div>
    {% endif %}
</div>

<script>
function toggleExpiration(checkbox) {
    const dateInput = document.querySelector('input[name="expiration_date"]');
    if (checkbox.checked) {
        dateInput.value = '';
        dateInput.style.display = 'none';
    } else {
        dateInput.style.display = 'block';
        dateInput.focus();
    }
}
document.addEventListener('DOMContentLoaded', function() {
    const checkbox = document.getElementById('noExpirationCheckbox');
    const dateInput = document.querySelector('input[name="expiration_date"]');
    if (checkbox && dateInput) {
        checkbox.addEventListener('change', function() { toggleExpiration(this); });
        if (checkbox.checked) { dateInput.style.display = 'none'; }
    }
});
</script>
{% endblock %}
